<body>
<div class="container py-4">
<h1>Catalogue Bootstrap Showcase</h1>
<p>Page de démonstration des principaux composants et variantes.</p>
<h2>Boutons</h2><div class="mb-3">
<button class="btn btn-primary">Primary</button> <button class="btn btn-secondary">Secondary</button> <button class="btn btn-success">Success</button> <button class="btn btn-danger">Danger</button> <button class="btn btn-warning">Warning</button> <button class="btn btn-info">Info</button></div><div class="mb-3"><button class="btn btn-outline-primary">Outline</button> <button class="btn btn-lg btn-primary">Large</button> <button class="btn btn-sm btn-primary">Small</button></div><h2>Alertes</h2><div class="alert alert-success">Succès</div><div class="alert alert-danger">Erreur</div><h2>Badges</h2><span class="badge bg-primary">Primary</span> <span class="badge bg-success">Success</span><h2>Cartes</h2><div class="row"><div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">Carte</h5><p>Exemple.</p><a class="btn btn-primary">Action</a></div></div></div></div><h2>Table</h2><table class="table table-striped table-hover"><tr><th>Nom</th><th>Valeur</th></tr><tr><td>A</td><td>1</td></tr></table><h2>Formulaire</h2><input class="form-control mb-2" placeholder="Texte"><select class="form-select"><option>Option 1</option></select><h2>Accordéon</h2><div class="accordion" id="a"><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#c1">Section</button></h2><div id="c1" class="accordion-collapse collapse show"><div class="accordion-body">Contenu</div></div></div></div><h2>Progress</h2><div class="progress"><div class="progress-bar" style="width:75%">75%</div></div><h2>Navigation</h2><ul class="nav nav-tabs"><li class="nav-item"><a class="nav-link active">Onglet 1</a></li><li class="nav-item"><a class="nav-link">Onglet 2</a></li></ul></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
